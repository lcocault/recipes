openapi: 3.0.0
info:
  title: Recipes & Cost Calculator API
  description: API specification for managing ingredients, recipes, costs, and sales.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /ingredients:
    get:
      summary: Get all ingredients
      responses:
        '200':
          description: A list of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
    post:
      summary: Add a new ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingredient'
      responses:
        '201':
          description: Ingredient created

  /ingredients/{id}:
    put:
      summary: Update an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingredient'
      responses:
        '200':
          description: Ingredient updated

components:
  schemas:
    Ingredient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        defaultUnit:
          type: string
        purchaseUnit:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
        density:
          type: number
          format: float
        notes:
          type: string

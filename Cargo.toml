[package]
name = "recipes"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
hyper = "1.0"

[[bin]]
name = "recipes"
path = "src/ingredient/main.rs"

[[bin]]
name = "api_server"
path = "src/ingredient/api.rs"
